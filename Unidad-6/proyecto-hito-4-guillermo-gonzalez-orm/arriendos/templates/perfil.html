{% extends 'base.html' %}

{% block content %}
    <h2>Página Personal</h2>
    <h3>Mis Datos Personales</h3>
    <ul>
        <li><strong>Nombre de usuario:</strong> {{ user.username }}</li>
        <li><strong>Nombre:</strong> {{ user.first_name }}</li>
        <li><strong>Apellido:</strong> {{ user.last_name }}</li>
        <li><strong>Correo electrónico:</strong> {{ user.email }}</li>
    </ul>
    <br>
    <!-- Botón para ir a modificar los datos -->
    <a href="{% url 'editar_perfil' %}"><button>Modificar mis datos</button></a>
{% endblock %}
