<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Portal Inmobiliario</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            border-radius: 10px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            border: 1px solid #e2e8f0;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h2 {
            color: #0f172a;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .header p {
            color: #64748b;
            font-size: 0.88rem;
            margin-top: 6px;
        }
        form p {
            margin-bottom: 18px;
        }
        form label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #1e293b;
        }
        form input[type="text"],
        form input[type="password"],
        form input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #f8fafc;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease-in-out;
        }
        form input:focus {
            background-color: #ffffff;
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }
        .helptext {
            display: block;
            font-size: 0.76rem;
            color: #64748b;
            line-height: 1.35;
            margin-top: 4px;
        }
        .helptext ul {
            list-style: disc inside;
            margin-top: 4px;
        }
        .errorlist {
            list-style: none;
            color: #b91c1c;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .btn-submit {
            width: 100%;
            background-color: #1e3a8a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background-color: #172554;
        }
        .footer-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: #64748b;
        }
        .footer-link a {
            color: #1e3a8a;
            font-weight: 600;
            text-decoration: none;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>Crear Cuenta</h2>
            <p>Accede al portal de arriendos inmobiliarios</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
        <div class="footer-link">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
