<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Finales</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="mb-4">Notas finales</h1>

        <div class="mb-4">
            <h5 class="fw-bold">Nombre: <span id="nombre" class="fw-normal"></span></h5>
            <h5 class="fw-bold">Carrera: <span id="carrera" class="fw-normal"></span></h5>
        </div>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Ramo</th>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                    <th>Nota 3</th>
                    <th>Promedio</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="fw-bold">HTML</td>
                    <td id="html-n1"></td>
                    <td id="html-n2"></td>
                    <td id="html-n3"></td>
                    <td id="html-promedio"></td>
                </tr>
                
                <tr>
                    <td class="fw-bold">CSS</td>
                    <td id="css-n1"></td>
                    <td id="css-n2"></td>
                    <td id="css-n3"></td>
                    <td id="css-promedio"></td>
                </tr>
                
                <tr>
                    <td class="fw-bold">JavaScript</td>
                    <td id="js-n1"></td>
                    <td id="js-n2"></td>
                    <td id="js-n3"></td>
                    <td id="js-promedio"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="assets/js/script.js"></script>
    
</body>
</html>
