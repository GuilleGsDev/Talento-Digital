<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto | Portafolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Portafolio TI</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about/">Sobre Mí</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/contact/">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Trabajemos Juntos</h2>
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre completo:</label>
                                <input type="text" class="form-control bg-light" placeholder="Ej. Juan Pérez">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo electrónico:</label>
                                <input type="email" class="form-control bg-light" placeholder="tu@correo.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">¿En qué te puedo ayudar?</label>
                                <textarea class="form-control bg-light" rows="4" placeholder="Describe tu proyecto o consulta aquí..."></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark btn-lg">Enviar Mensaje</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
