<nav class="navbar navbar-expand-lg navbar-light bg-warning container">
    <div class="container-fluid">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item">
                <a class="nav-link text-dark" href="{% url 'indice' %}">Inicio</a>
            </li>
            
            <!-- Solo se muestra si el usuario está logueado -->
            {% if user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link text-dark" href="{% url 'bienvenido' %}">Bienvenido</a>
            </li>
            {% endif %}
            
            <li class="nav-item">
                <a class="nav-link text-dark" href="{% url 'acerca' %}">Acerca</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark" href="{% url 'contacto' %}">Contacto</a>
            </li>
            
            <!-- Botones dinámicos de sesión -->
            {% if user.is_authenticated %}
                <!-- Solo si está logueado -->
                <li class="nav-item ms-2">
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-secondary nav-link text-white px-3" style="border: none;">Cerrar sesión</button>
                    </form>
                </li>
            {% else %}
                <!-- Solo si NO está logueado -->
                <li class="nav-item ms-2">
                    <a class="nav-link text-white bg-secondary rounded px-3" href="{% url 'login' %}">Iniciar sesión</a>
                </li>
            {% endif %}
        </ul>
    </div>
