{% extends 'base.html' %}
{% block contenido %}
<h2 class="mb-4">Nuestros Flanes</h2>
<div class="row">
    <!-- Ciclo for para recorrer los flanes públicos -->
    {% for flan in flanes %}
    <div class="col-12 col-md-3 mb-4">
        <div class="card h-100">
            <img src="{{ flan.image_url }}" class="card-img-top" alt="{{ flan.name }}">
            <div class="card-body">
                <h5 class="card-title">{{ flan.name }}</h5>
                <h5 class="card-title">{{ flan.name }}</h5>
<h6 class="text-success">${{ flan.price }} CLP</h6>
                <p class="card-text">{{ flan.description }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
