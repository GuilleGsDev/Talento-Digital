{% extends 'base.html' %}

{% block contenido %}
<div class="col-12 col-md-4 offset-0 offset-md-4 mt-4 mb-4 text-center">
    <h3 class="mb-4">Iniciar sesión</h3>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Iniciar sesión</button>
    </form>
</div>
{% endblock %}
